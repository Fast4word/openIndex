name: Crawl and update OpenIndex

on:
  workflow_dispatch:
  schedule:
    # Avoid the top of the hour when GitHub queues are busiest.
    - cron: "37 */3 * * *"

permissions:
  contents: read

concurrency:
  group: openindex-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt

      - name: Install crawler dependencies
        run: python -m pip install -r crawler/requirements.txt

      - name: Crawl a small, polite batch
        run: python crawler/crawl.py
        env:
          SEARCH_API_URL: ${{ secrets.SEARCH_API_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          MAX_PAGES: "24"
          CRAWLER_USER_AGENT: "OpenIndexBot/0.1 (+https://github.com/Fast4word/openIndex)"
